name: learn_flutter_v3_47
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  envied: ^1.3.8
  go_router: ^18.0.1
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  iconsax_flutter: ^1.0.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.1.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  envied_generator: ^1.3.8
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
